name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

      # Non-blocking for now: remaining advisories come from @vercel/node
      # (dev-only types) that have no upstream fix yet. Flip to a hard gate
      # once upstream releases patched versions.
      - name: Dependency audit (report only)
        run: npm audit --audit-level=critical || true
